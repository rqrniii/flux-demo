apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rqrniii/flux-demo.git
    targetRevision: HEAD
    path: argocd-apps/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-demo-ns
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
